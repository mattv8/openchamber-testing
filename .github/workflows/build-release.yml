name: Build Custom Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref in mattv8/openchamber
        required: true
        default: openchamber-custom
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned macOS arm64 DMG
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.source_metadata.outputs.version }}
      artifact_name: ${{ steps.package_artifact.outputs.artifact_name }}
      sdk_version: ${{ steps.source_metadata.outputs.sdk_version }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Validate requested source ref
        id: validate_source_ref
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sourceRef = (process.env.REQUESTED_SOURCE_REF || '').trim();
          if (!sourceRef) {
            throw new Error('source_ref is required.');
          }
          if (!/^[0-9A-Za-z._/-]+$/.test(sourceRef)) {
            throw new Error(`source_ref contains unsupported characters: ${sourceRef}`);
          }
          if (
            sourceRef.startsWith('/') ||
            sourceRef.endsWith('/') ||
            sourceRef.includes('..') ||
            sourceRef.includes('//') ||
            sourceRef.includes('\\') ||
            sourceRef.includes('@{')
          ) {
            throw new Error(`source_ref is not a safe Git ref: ${sourceRef}`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_ref=${sourceRef}\n`);
          NODE

      - name: Check out selected source ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: mattv8/openchamber
          ref: ${{ steps.validate_source_ref.outputs.source_ref }}
          persist-credentials: false

      - name: Resolve and validate source metadata
        id: source_metadata
        env:
          REQUESTED_SOURCE_REF: ${{ steps.validate_source_ref.outputs.source_ref }}
          SOURCE_REPO: mattv8/openchamber
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const rootPackage = JSON.parse(fs.readFileSync(path.join(process.cwd(), 'package.json'), 'utf8'));
          const electronPackage = JSON.parse(
            fs.readFileSync(path.join(process.cwd(), 'packages/electron/package.json'), 'utf8'),
          );

          const sourceRef = process.env.REQUESTED_SOURCE_REF;
          const sourceSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
            throw new Error(`Expected lowercase 40-character source SHA, got: ${sourceSha}`);
          }

          const version = String(rootPackage.version || '');
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Root package version is not SemVer-compatible: ${version}`);
          }

          const packageManager = String(rootPackage.packageManager || '');
          const bunMatch = /^bun@([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$/.exec(packageManager);
          if (!bunMatch) {
            throw new Error(`packageManager must be bun@<version>, got: ${packageManager}`);
          }

          const sdkVersion = String((rootPackage.dependencies || {})['@opencode-ai/sdk'] || '').trim();
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(sdkVersion)) {
            throw new Error(`@opencode-ai/sdk must be pinned to a version, got: ${sdkVersion}`);
          }

          const publish = electronPackage.build && electronPackage.build.publish;
          if (!publish || publish.provider !== 'github' || publish.owner !== 'openchamber' || publish.repo !== 'openchamber') {
            throw new Error('Electron publish configuration must target openchamber/openchamber on GitHub.');
          }

          const macArtifactName = electronPackage.build && electronPackage.build.mac && electronPackage.build.mac.artifactName;
          if (macArtifactName !== '${productName}-${version}-mac-${arch}.${ext}') {
            throw new Error(`Unexpected mac artifactName: ${macArtifactName}`);
          }

          const sourceUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.SOURCE_REPO}/commit/${sourceSha}`;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const urlPattern = /^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/(?:commit\/[0-9a-f]{40}|actions\/runs\/\d+)$/;
          if (!urlPattern.test(sourceUrl)) {
            throw new Error(`Invalid sourceUrl: ${sourceUrl}`);
          }
          if (!urlPattern.test(runUrl)) {
            throw new Error(`Invalid runUrl: ${runUrl}`);
          }

          const shortSha = sourceSha.slice(0, 12);
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `source_ref=${sourceRef}\n`);
          fs.appendFileSync(output, `source_sha=${sourceSha}\n`);
          fs.appendFileSync(output, `short_sha=${shortSha}\n`);
          fs.appendFileSync(output, `version=${version}\n`);
          fs.appendFileSync(output, `bun_version=${bunMatch[1]}\n`);
          fs.appendFileSync(output, `sdk_version=${sdkVersion}\n`);
          fs.appendFileSync(output, `source_url=${sourceUrl}\n`);
          fs.appendFileSync(output, `run_url=${runUrl}\n`);
          NODE

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.source_metadata.outputs.bun_version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-arm64-${{ steps.source_metadata.outputs.sdk_version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-arm64-

      - name: Build unsigned Electron app (arm64)
        working-directory: packages/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ARCH: arm64
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          ./node_modules/.bin/electron-builder \
            --mac \
            --arm64 \
            --publish=never \
            --config.mac.identity=- \
            --config.mac.notarize=false \
            --config.dmg.sign=false
          app_path="dist/mac-arm64/OpenChamber.app"
          test -f "$app_path/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          bun run verify:opencode-cli:packaged

      - name: Package validated DMG and provenance
        id: package_artifact
        env:
          REQUESTED_SOURCE_REF: ${{ steps.source_metadata.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.source_metadata.outputs.source_sha }}
          SHORT_SHA: ${{ steps.source_metadata.outputs.short_sha }}
          SOURCE_URL: ${{ steps.source_metadata.outputs.source_url }}
          RUN_URL: ${{ steps.source_metadata.outputs.run_url }}
          VERSION: ${{ steps.source_metadata.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const distDir = path.join(process.cwd(), 'packages/electron/dist');
          const entries = fs.readdirSync(distDir, { withFileTypes: true });
          const dmgs = entries
            .filter((entry) => entry.isFile() && entry.name.endsWith('-mac-arm64.dmg'))
            .map((entry) => path.join(distDir, entry.name));

          if (dmgs.length !== 1) {
            throw new Error(`Expected exactly one *-mac-arm64.dmg, found ${dmgs.length}`);
          }

          const dmgPath = dmgs[0];
          const dmgStat = fs.statSync(dmgPath);
          if (dmgStat.size <= 0) {
            throw new Error(`DMG is empty: ${dmgPath}`);
          }

          const version = process.env.VERSION;
          const sourceSha = process.env.SOURCE_SHA;
          const shortSha = process.env.SHORT_SHA;
          const artifactName = `OpenChamber-${version}-custom-${shortSha}-mac-arm64.dmg`;
          const artifactsDir = path.join(process.cwd(), 'artifacts');
          fs.mkdirSync(artifactsDir, { recursive: true });

          const finalDmgPath = path.join(artifactsDir, artifactName);
          fs.copyFileSync(dmgPath, finalDmgPath);

          const provenance = {
            sourceRef: process.env.REQUESTED_SOURCE_REF,
            sourceSha,
            sourceUrl: process.env.SOURCE_URL,
            version,
            artifactName,
            runUrl: process.env.RUN_URL,
            unsigned: true,
          };
          fs.writeFileSync(path.join(artifactsDir, 'provenance.json'), `${JSON.stringify(provenance, null, 2)}\n`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_name=${artifactName}\n`);
          NODE

      - name: Upload DMG and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-macos-arm64
          path: |
            artifacts/${{ steps.package_artifact.outputs.artifact_name }}
            artifacts/provenance.json
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish custom prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openchamber-macos-arm64
          path: artifacts

      - name: Revalidate artifact and provenance
        id: validate_release
        env:
          EXPECTED_SDK_VERSION: ${{ needs.build.outputs.sdk_version }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const artifactsDir = path.join(process.cwd(), 'artifacts');
          const provenancePath = path.join(artifactsDir, 'provenance.json');
          if (!fs.existsSync(provenancePath)) {
            throw new Error('provenance.json is missing.');
          }

          const provenance = JSON.parse(fs.readFileSync(provenancePath, 'utf8'));
          const expectedKeys = ['artifactName', 'runUrl', 'sourceRef', 'sourceSha', 'sourceUrl', 'unsigned', 'version'];
          const actualKeys = Object.keys(provenance).sort();
          if (JSON.stringify(actualKeys) !== JSON.stringify(expectedKeys)) {
            throw new Error(`Unexpected provenance keys: ${actualKeys.join(', ')}`);
          }

          const sourceRef = String(provenance.sourceRef || '').trim();
          if (!sourceRef || !/^[0-9A-Za-z._/-]+$/.test(sourceRef) || sourceRef.startsWith('/') || sourceRef.endsWith('/') || sourceRef.includes('..') || sourceRef.includes('//') || sourceRef.includes('\\') || sourceRef.includes('@{')) {
            throw new Error(`Invalid sourceRef in provenance: ${sourceRef}`);
          }

          const sourceSha = String(provenance.sourceSha || '').trim();
          if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
            throw new Error(`Invalid sourceSha in provenance: ${sourceSha}`);
          }

          const sourceUrl = String(provenance.sourceUrl || '').trim();
          const expectedSourceUrl = `${process.env.GITHUB_SERVER_URL}/mattv8/openchamber/commit/${sourceSha}`;
          if (sourceUrl !== expectedSourceUrl) {
            throw new Error(`Invalid sourceUrl in provenance: ${sourceUrl}`);
          }

          const version = String(provenance.version || '').trim();
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid version in provenance: ${version}`);
          }

          const artifactName = String(provenance.artifactName || '').trim();
          const expectedArtifactName = `OpenChamber-${version}-custom-${sourceSha.slice(0, 12)}-mac-arm64.dmg`;
          if (artifactName !== expectedArtifactName) {
            throw new Error(`Invalid artifactName in provenance: ${artifactName}`);
          }

          const runUrl = String(provenance.runUrl || '').trim();
          const expectedRunUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          if (runUrl !== expectedRunUrl) {
            throw new Error(`Invalid runUrl in provenance: ${runUrl}`);
          }

          if (provenance.unsigned !== true) {
            throw new Error('unsigned must be true in provenance.');
          }

          const entries = fs.readdirSync(artifactsDir, { withFileTypes: true });
          const dmgFiles = entries.filter((entry) => entry.isFile() && entry.name.endsWith('.dmg'));
          if (dmgFiles.length !== 1) {
            throw new Error(`Expected exactly one DMG artifact, found ${dmgFiles.length}`);
          }
          if (dmgFiles[0].name !== artifactName) {
            throw new Error(`Downloaded DMG name mismatch: ${dmgFiles[0].name}`);
          }

          const dmgPath = path.join(artifactsDir, dmgFiles[0].name);
          if (fs.statSync(dmgPath).size <= 0) {
            throw new Error(`DMG artifact is empty: ${dmgFiles[0].name}`);
          }

          const runNumber = String(process.env.GITHUB_RUN_NUMBER || '').trim();
          const runAttempt = String(process.env.GITHUB_RUN_ATTEMPT || '').trim();
          if (!/^\d+$/.test(runNumber) || !/^\d+$/.test(runAttempt)) {
            throw new Error('run_number and run_attempt must be numeric.');
          }

          const tagName = `custom-v${version}-build.${runNumber}.${runAttempt}`;
          const releaseNotes = [
            `Requested source ref: ${sourceRef}`,
            `Source commit: [${sourceSha}](${sourceUrl})`,
            `Workflow run: [${runUrl}](${runUrl})`,
            '',
            'This build is unsigned. macOS Gatekeeper may block it on first launch.',
            'After downloading the DMG to ~/Downloads, remove quarantine before opening it:',
            '```sh',
            `xattr -dr com.apple.quarantine "$HOME/Downloads/${artifactName}"`,
            `open "$HOME/Downloads/${artifactName}"`,
            '```',
            '',
            'Warning: this custom build keeps the official OpenChamber updater behavior. Installing an official update can replace custom behavior from this prerelease.',
            '',
            `Bundled OpenCode CLI disclosure: this app downloads and bundles the official anomalyco/opencode GitHub release asset that matches pinned SDK version ${process.env.EXPECTED_SDK_VERSION}.`,
          ].join('\n');

          fs.writeFileSync(path.join(artifactsDir, 'release-notes.md'), `${releaseNotes}\n`);

          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `artifact_path=${dmgPath}\n`);
          fs.appendFileSync(output, `tag_name=${tagName}\n`);
          fs.appendFileSync(output, `version=${version}\n`);
          NODE

      - name: Confirm release tag does not exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.validate_release.outputs.tag_name }}
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/tags/${encodeURIComponent(process.env.TAG_NAME)}`, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
              },
            });

            if (response.status === 404) {
              return;
            }
            if (response.ok) {
              throw new Error(`Release tag already exists: ${process.env.TAG_NAME}`);
            }

            throw new Error(`Failed to check tag existence: ${response.status} ${await response.text()}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Create prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.validate_release.outputs.tag_name }}
          name: ${{ steps.validate_release.outputs.tag_name }}
          prerelease: true
          draft: false
          body_path: artifacts/release-notes.md
          files: ${{ steps.validate_release.outputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write run summary
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.validate_release.outputs.tag_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const artifactName = String(process.env.ARTIFACT_NAME || '').trim();
          const tagName = String(process.env.TAG_NAME || '').trim();
          if (!artifactName || !tagName) {
            throw new Error('Release summary requires artifact and tag names.');
          }

          const releaseUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/download/${encodeURIComponent(tagName)}/${encodeURIComponent(artifactName)}`;
          const summary = [
            '## OpenChamber custom macOS build',
            '',
            `[Download ${artifactName}](${releaseUrl})`,
            '',
            'This build is unsigned. After downloading it to `~/Downloads`, run:',
            '',
            '```sh',
            `xattr -dr com.apple.quarantine "$HOME/Downloads/${artifactName}"`,
            `open "$HOME/Downloads/${artifactName}"`,
            '```',
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE
