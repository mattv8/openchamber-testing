name: Watch Custom Release

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-custom-release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect unreleased custom source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.detect.outputs.source_sha }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Check out orchestration repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Check custom release status
        id: detect
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: mattv8/openchamber
          SOURCE_REF: openchamber-custom
          RELEASE_REPO: mattv8/openchamber-testing
        run: node scripts/check-custom-release.mjs

  release:
    name: Build custom prerelease
    needs: detect
    if: ${{ needs.detect.outputs.should_build == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      source_ref: ${{ needs.detect.outputs.source_sha }}
